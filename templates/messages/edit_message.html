{% extends 'base.html' %}

{% block title %}Edit Message - Signals{% endblock %}

{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card border-0 shadow-lg profile-card" style="border-radius: 10px;">
                <div class="card-header border-0 bg-transparent pt-4 ps-4">
                    <h5 class="fw-bold profile-text-primary">Edit Message</h5>
                </div>
                <div class="card-body p-4">
                    <form method="post">
                        {% csrf_token %}
                        <div class="mb-3">
                            <textarea name="content" rows="3" class="form-control profile-input border-0" style="resize: none;" required>{{ message.content }}</textarea>
                        </div>
                        <div class="d-flex justify-content-end gap-2">
                            <a href="{% url 'chat_with_user' message.receiver.id %}" class="btn btn-link text-decoration-none text-secondary fw-semibold">Cancel</a>
                            <button type="submit" class="btn btn-primary px-4 fw-bold rounded-pill">Save</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
