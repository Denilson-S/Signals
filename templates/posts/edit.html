{% extends 'base.html' %}

{% block title %}Edit Post - Signals{% endblock %}

{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card border-0 shadow-lg" style="border-radius: 10px;">
                <div class="card-header border-0 bg-transparent pt-4 ps-4">
                    <h5 class="fw-bold">Edit Post</h5>
                </div>
                <div class="card-body p-4">
                    <form method="post" enctype="multipart/form-data">
                        {% csrf_token %}
                        <div class="d-flex align-items-center mb-3">
                            <!-- User Avatar -->
                            <div class="me-3">
                                {% if user.profile.avatar %}
                                    <img src="{{ user.profile.avatar.url }}" alt="{{ user.username }}" class="rounded-circle object-fit-cover" width="50" height="50">
                                {% else %}
                                    <div class="rounded-circle bg-secondary d-flex justify-content-center align-items-center text-white" style="width: 50px; height: 50px;">
                                        <i class="bi bi-person-fill fs-4"></i>
                                    </div>
                                {% endif %}
                            </div>
                            
                            <!-- Input Field -->
                            <div class="flex-grow-1">
                                <div class="input-group">
                                    {{ form.content }}
                                </div>
                            </div>
                        </div>

                        <!-- Tag Section -->
                        <div class="d-flex align-items-center ms-5 ps-3 mb-3">
                            <i class="bi bi-tag-fill text-primary fs-5 me-2"></i>
                            <span class="fw-semibold me-3">Tag</span>
                            <div class="flex-grow-1">
                                {{ form.tags }}
                            </div>
                        </div>

                        <!-- Submit Button -->
                        <div class="d-flex justify-content-end border-top border-secondary pt-3 mt-2 gap-2">
                            <a href="/" class="btn btn-link text-decoration-none text-secondary fw-semibold align-self-center">Cancel</a>
                            <button type="submit" class="btn btn-primary px-4 fw-bold rounded-pill">Save</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
