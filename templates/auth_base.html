{% load static %}
<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Signals{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Lobster&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #000000; /* Deep black background */
            color: #fff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
        }
        .auth-container {
            width: 100%;
            max-width: 980px;
            margin: 0 auto;
            padding: 20px;
        }
        .brand-logo-big {
            font-family: 'Lobster', cursive;
            font-size: 4rem;
            color: #1877f2;
            margin-bottom: 0;
        }
        .brand-slogan {
            font-size: 1.5rem;
            line-height: 32px;
            width: 500px;
            display: inline-block;
        }
        .auth-card {
            background-color: #18191a; /* Dark card background */
            border: none;
            border-radius: 8px;
            box-shadow: 0 2px 4px rgba(0, 0, 0, .1), 0 8px 16px rgba(0, 0, 0, .1);
            padding: 20px;
            width: 396px;
        }
        .form-control-auth {
            font-size: 17px;
            padding: 14px 16px;
            border-radius: 6px;
            border: 1px solid #3e4042;
            background-color: #18191a;
            color: #fff;
            margin-bottom: 12px;
        }
        .form-control-auth:focus {
            background-color: #18191a;
            color: #fff;
            border-color: #1877f2;
            box-shadow: 0 0 0 2px rgba(24, 119, 242, 0.2);
        }
        .btn-auth-primary {
            background-color: #1877f2;
            border: none;
            border-radius: 6px;
            font-size: 20px;
            line-height: 48px;
            padding: 0 16px;
            width: 100%;
            color: #fff;
            font-weight: bold;
            margin-bottom: 10px;
        }
        .btn-auth-primary:hover {
            background-color: #166fe5;
            color: #fff;
        }
        .forgot-link {
            color: #1877f2;
            font-size: 14px;
            text-decoration: none;
            display: block;
            text-align: center;
            margin-bottom: 20px;
        }
        .forgot-link:hover {
            text-decoration: underline;
        }
        .auth-divider {
            border-bottom: 1px solid #3e4042;
            margin: 20px 0;
        }
        .btn-auth-success {
            background-color: #42b72a;
            border: none;
            border-radius: 6px;
            font-size: 17px;
            line-height: 48px;
            padding: 0 16px;
            color: #fff;
            font-weight: bold;
            display: block;
            margin: 0 auto;
            width: auto;
        }
        .btn-auth-success:hover {
            background-color: #36a420;
            color: #fff;
        }
        
        /* Placeholder color */
        ::placeholder {
            color: #8a8d91 !important;
            opacity: 1;
        }

        @media (max-width: 900px) {
            body {
                align-items: flex-start;
                padding-top: 40px;
                height: auto;
            }
            .auth-container {
                flex-direction: column;
                align-items: center;
                text-align: center;
            }
            .brand-slogan {
                width: auto;
                margin-bottom: 40px;
            }
            .auth-card {
                width: 100%;
                max-width: 396px;
            }
        }
    </style>
    {% block extra_css %}{% endblock %}
  </head>
  <body>
    {% block content %}{% endblock %}
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
