{% extends 'base.html' %}

{% block title %}Edit Profile - Signals{% endblock %}

{% block content %}
<div class="container py-4">
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <div class="card border-0 shadow-sm profile-card" style="border-radius: 16px;">
                <div class="card-header bg-transparent border-0 pt-4 ps-4">
                    <h4 class="fw-bold profile-text-primary">Edit Profile</h4>
                </div>
                <div class="card-body p-4">
                    <form method="post" enctype="multipart/form-data">
                        {% csrf_token %}
                        
                        <div class="row g-3 mb-3">
                            <div class="col-md-6">
                                <label class="form-label profile-label small fw-bold">First Name</label>
                                {{ user_form.first_name }}
                            </div>
                            <div class="col-md-6">
                                <label class="form-label profile-label small fw-bold">Last Name</label>
                                {{ user_form.last_name }}
                            </div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label profile-label small fw-bold">Avatar</label>
                            {{ profile_form.avatar }}
                        </div>

                        <div class="mb-3">
                            <label class="form-label profile-label small fw-bold">Bio</label>
                            {{ profile_form.bio }}
                        </div>

                        <div class="mb-3">
                            <label class="form-label profile-label small fw-bold">Birth Date</label>
                            {{ profile_form.birth_date }}
                        </div>

                        <div class="d-flex justify-content-end gap-2 mt-4">
                            <a href="{% url 'profile' %}" class="btn btn-link text-decoration-none text-secondary fw-semibold">Cancel</a>
                            <button type="submit" class="btn btn-primary px-4 fw-bold rounded-pill">Save Changes</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
